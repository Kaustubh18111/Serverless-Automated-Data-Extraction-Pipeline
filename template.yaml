AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless automated data extraction pipeline using AWS Lambda, EventBridge, S3, DynamoDB, IAM, and Python dependency layer.

Parameters:
  FunctionName:
    Type: String
    Default: serverless-automated-data-extraction
    Description: Name assigned to the Lambda function.
  SourceUrl:
    Type: String
    Default: http://books.toscrape.com/
    Description: HTTP endpoint to scrape.
  StorageMode:
    Type: String
    Default: BOTH
    AllowedValues:
      - S3
      - DYNAMODB
      - BOTH
    Description: Destination storage mode.
  MaxPages:
    Type: Number
    Default: 1
    Description: Maximum pages scraped per invocation.
  HttpTimeoutSeconds:
    Type: Number
    Default: 15
    Description: HTTP request timeout in seconds.
  S3Prefix:
    Type: String
    Default: raw/books
    Description: S3 object prefix for JSON payloads.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Application log level.
  S3SseMode:
    Type: String
    Default: AES256
    AllowedValues:
      - AES256
      - aws:kms
    Description: Server-side encryption mode for S3 objects.
  S3KmsKeyId:
    Type: String
    Default: ''
    Description: Optional KMS Key ID/ARN used when S3SseMode is aws:kms.

Resources:
  RawDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ExtractionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: item_id
          AttributeType: S
        - AttributeName: extraction_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: item_id
          KeyType: HASH
        - AttributeName: extraction_timestamp
          KeyType: RANGE

  DataExtractionLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: python3.10
    Properties:
      LayerName: data-extraction-dependencies
      Description: Dependencies for requests and BeautifulSoup4.
      ContentUri: layer/data_extraction_layer/
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Retain

  LambdaDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${FunctionName}-dlq'
      MessageRetentionPeriod: 1209600

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${FunctionName}-alerts'

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${FunctionName}-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lambda-data-pipeline-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowCreateLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: '*'
              - Sid: AllowWriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*'
              - Sid: AllowWriteToSpecificBucket
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub '${RawDataBucket.Arn}/*'
              - Sid: AllowWriteToSpecificTable
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt ExtractionTable.Arn
              - Sid: AllowWriteToDlq
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt LambdaDlq.Arn

  DataExtractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      CodeUri: .
      Handler: src.handler.lambda_handler
      Runtime: python3.10
      Architectures:
        - x86_64
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref DataExtractionLayer
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDlq.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref RawDataBucket
          TABLE_NAME: !Ref ExtractionTable
          STORAGE_MODE: !Ref StorageMode
          SOURCE_URL: !Ref SourceUrl
          MAX_PAGES: !Ref MaxPages
          HTTP_TIMEOUT_SECONDS: !Ref HttpTimeoutSeconds
          S3_PREFIX: !Ref S3Prefix
          LOG_LEVEL: !Ref LogLevel
          S3_SSE_MODE: !Ref S3SseMode
          S3_KMS_KEY_ID: !Ref S3KmsKeyId

  ExtractionScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Triggers the data extraction Lambda every 12 hours.
      ScheduleExpression: cron(0 */12 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt DataExtractionFunction.Arn
          Id: DataExtractionFunctionTarget

  EventBridgeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DataExtractionFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExtractionScheduleRule.Arn

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${FunctionName}-errors'
      AlarmDescription: Alarm when Lambda execution errors exceed 0 in a period.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DataExtractionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

Outputs:
  LambdaFunctionArn:
    Description: ARN of the Lambda function.
    Value: !GetAtt DataExtractionFunction.Arn
  S3BucketName:
    Description: Name of the S3 bucket storing raw JSON output.
    Value: !Ref RawDataBucket
  DynamoDBTableName:
    Description: Name of the DynamoDB table storing structured records.
    Value: !Ref ExtractionTable
  AlertsTopicArn:
    Description: SNS topic receiving alarm notifications.
    Value: !Ref AlertsTopic
  LambdaDlqUrl:
    Description: SQS dead letter queue URL.
    Value: !Ref LambdaDlq

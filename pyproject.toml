[project]
name = "serverless-automated-data-extraction-pipeline"
version = "0.1.0"
description = "Serverless scheduled web data extraction pipeline with AWS Lambda, EventBridge, S3, and DynamoDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "moto[s3,dynamodb]>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "boto3>=1.34.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["^\\.aws-sam/"]
